<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chexta - Bakım</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 600px at 20% 50%, rgba(124, 58, 237, 0.12), transparent),
        radial-gradient(ellipse 500px 500px at 80% 30%, rgba(16, 185, 129, 0.08), transparent),
        radial-gradient(ellipse 400px 400px at 60% 80%, rgba(124, 58, 237, 0.06), transparent);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .container {
      position: relative;
      text-align: center;
      padding: 2rem;
      max-width: 520px;
      width: 100%;
    }

    .logo {
      height: 36px;
      filter: brightness(0) invert(1);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeDown 0.8s ease forwards;
    }

    /* Animated gear icon */
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeDown 0.8s 0.15s ease forwards;
    }

    .gear {
      width: 40px;
      height: 40px;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: fadeDown 0.8s 0.3s ease forwards;
    }

    .subtitle {
      font-size: 1rem;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeDown 0.8s 0.45s ease forwards;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeDown 0.8s 0.6s ease forwards;
    }

    .progress-bar {
      height: 100%;
      width: 30%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c3aed, #10b981);
      animation: progressMove 2s ease-in-out infinite;
    }

    @keyframes progressMove {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 60%; }
      100% { transform: translateX(400%); width: 30%; }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 999px;
      font-size: 0.8rem;
      color: #6ee7b7;
      opacity: 0;
      animation: fadeDown 0.8s 0.75s ease forwards;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: #4b5563;
      opacity: 0;
      animation: fadeDown 0.8s 0.9s ease forwards;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Chexta" class="logo">

    <div class="icon-wrap">
      <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </div>

    <h1>Sistem Bakımda</h1>
    <p class="subtitle">
      Daha iyi bir deneyim sunmak için kısa süreli bakım çalışması yapıyoruz.<br>
      En kısa sürede tekrar aktif olacağız.
    </p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      Bakım devam ediyor...
    </div>
  </div>

  <div class="footer">
    &copy; 2026 Chexta &mdash; Tum hakları saklıdır.
  </div>
</body>
</html>
